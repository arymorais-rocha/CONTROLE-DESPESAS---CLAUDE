<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Despesas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0F1B2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despesas">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --navy-900:#0F1B2C;
  --navy-800:#16263D;
  --navy-700:#1E3252;
  --bg:#E9EDE9;
  --surface:#FFFFFF;
  --ink:#16233A;
  --ink-soft:#5B6B7C;
  --rule:#DDE3DE;
  --blue:#2F6FEB;
  --green:#2F8F5B;
  --red:#C13A3A;
  --amber:#C1791F;
  --romerio:#6B4A63;
  --boaesp:#3F6B4A;
  --alvorada:#8A5A34;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
#app{max-width:1180px;margin:0 auto;padding:0 0 60px;}

.topbar{background:var(--navy-900);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.topbar h1{font-family:'Zilla Slab',serif;font-size:23px;font-weight:600;margin:0;}
.topbar .sub{font-size:12px;color:#9FB0C4;margin-top:3px;display:flex;align-items:center;gap:6px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;}
.topbar .actions{display:flex;gap:10px;align-items:center;}
.btn{border:none;border-radius:5px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:#2559c4;}
.btn-ghost{background:var(--navy-700);color:#fff;}
.btn-ghost:hover{background:#28405f;}
.btn-green{background:var(--green);color:#fff;}

.dropdown-wrap{position:relative;}
.export-menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--rule);border-radius:7px;box-shadow:0 10px 28px rgba(0,0,0,.18);min-width:250px;z-index:60;overflow:hidden;}
.export-menu .group-label{font-size:10.5px;font-weight:700;color:var(--ink-soft);padding:9px 14px 4px;}
.export-menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 14px;font-size:13px;cursor:pointer;color:var(--ink);font-family:'Inter',sans-serif;}
.export-menu button:hover:not(:disabled){background:#F1F4F1;}
.export-menu button:disabled{color:#B7C0C7;cursor:not-allowed;}
.export-menu .divider{border-top:1px solid var(--rule);margin:4px 0;}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:22px 24px 0;}
.card{background:var(--surface);border-radius:8px;padding:16px 18px;border:1px solid var(--rule);}
.card .label{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
.card .value{font-family:'Zilla Slab',serif;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;}
.card.vencidas .value{color:var(--red);}
.card.hoje .value{color:var(--amber);}

.filterbar{background:var(--navy-800);margin:20px 24px 0;border-radius:8px;padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.filterbar select,.filterbar input{background:var(--navy-700);border:1px solid #33506f;color:#fff;border-radius:5px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;}
.filterbar input::placeholder{color:#8FA3BB;}
.filterbar select{color:#fff;}
.filterbar .grow{flex:1;min-width:160px;}
.filterbar .clear{background:transparent;color:#9FB0C4;border:none;font-size:12.5px;cursor:pointer;text-decoration:underline;}

.statusbar{display:flex;justify-content:space-between;align-items:center;margin:12px 24px 0;flex-wrap:wrap;gap:10px;}
.status-chips{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;}
.status-chips label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-soft);}
.status-chips input{accent-color:var(--blue);}
.status-chips .desmarcar{color:var(--blue);cursor:pointer;font-size:12.5px;text-decoration:underline;}
.right-actions{display:flex;gap:8px;}

.tablewrap{margin:16px 24px 0;background:var(--surface);border-radius:8px;border:1px solid var(--rule);overflow:hidden;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:left;padding:11px 14px;font-size:11.5px;color:var(--ink-soft);font-weight:600;border-bottom:1px solid var(--rule);background:#F5F7F5;white-space:nowrap;}
tbody td{padding:12px 14px;border-bottom:1px solid var(--rule);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBF9;}
.fornecedor{font-weight:500;}
.fornecedor .plano-tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;color:#fff;margin-top:4px;}
.valor-cell{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
.date-cell{font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap;}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.badge.em-aberto{background:#E4ECFB;color:var(--blue);}
.badge.vencida{background:#FBE6E6;color:var(--red);animation:blink-red 1.1s ease-in-out infinite;}
.badge.paga{background:#E3F3EA;color:var(--green);}
.badge.vence-hoje{background:#FBEEDB;color:var(--amber);animation:blink-amber 1.1s ease-in-out infinite;}

@keyframes blink-red{
  0%, 100%{ background:#FBE6E6; color:var(--red); }
  50%{ background:var(--red); color:#fff; }
}
@keyframes blink-amber{
  0%, 100%{ background:#FBEEDB; color:var(--amber); }
  50%{ background:var(--amber); color:#fff; }
}
@media (prefers-reduced-motion: reduce){
  .badge.vencida, .badge.vence-hoje{ animation:none; }
}
.acoes{display:flex;gap:8px;}
.icon-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--rule);background:#fff;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-soft);}
.icon-btn.danger:hover{color:var(--red);border-color:var(--red);}
.empty-row td{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-row b{display:block;font-family:'Zilla Slab',serif;font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:600;}

.modal-overlay{position:fixed;inset:0;background:rgba(15,27,44,0.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:70;overflow:auto;}
.modal{background:#fff;border-radius:10px;padding:22px;max-width:480px;width:100%;}
.modal h2{font-family:'Zilla Slab',serif;font-size:18px;margin:0 0 16px;font-weight:600;}
.tipo-toggle{display:flex;border:1px solid var(--ink);border-radius:5px;overflow:hidden;width:fit-content;margin-bottom:16px;}
.tipo-toggle button{border:none;background:#fff;color:var(--ink-soft);padding:7px 16px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;}
.tipo-toggle button.active{background:var(--ink);color:#fff;}
.tipo-toggle button:not(:last-child){border-right:1px solid var(--ink);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:5px;font-size:13.5px;font-family:'Inter',sans-serif;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.btn-outline{background:#fff;border:1px solid var(--rule);color:var(--ink-soft);}

.footer-note{margin:16px 24px 0;font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}

.planos-list{max-height:280px;overflow-y:auto;margin-bottom:14px;}
.plano-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);}
.plano-row:last-child{border-bottom:none;}
.plano-row input[type="color"]{width:30px;height:30px;padding:2px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;flex-shrink:0;}
.plano-row input[type="text"]{flex:1;padding:8px 9px;border:1px solid var(--rule);border-radius:5px;font-size:13.5px;font-family:'Inter',sans-serif;}
.plano-add-row{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--rule);}
.plano-add-row input[type="color"]{width:30px;height:30px;padding:2px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;flex-shrink:0;}
.plano-add-row input[type="text"]{flex:1;padding:9px 10px;border:1px solid var(--rule);border-radius:5px;font-size:13.5px;font-family:'Inter',sans-serif;}

@media (max-width:760px){
  .cards{grid-template-columns:repeat(2,1fr);}
  table{font-size:12.5px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhlewWTqDvTYWP0sr5rmAg7swjS0w74DlSlK8swV2RLbSrUPrUkB_usivnXT7rI7BR/exec';
const ACCESS_TOKEN = 'S_diM8z8pN3mUVIlSUwsG1Voe71el-NF';
let lastSyncPayload = null;

let state = {
  contas: [],
  planos: [],
  loading: true,
  selected: new Set(),
  filterPlano: 'todos',
  filterBusca: '',
  filterMes: '',
  filterDe: '',
  filterAte: '',
  filterDateField: 'vencimento',
  filterSituacao: new Set(['em-aberto','vencida','paga','vence-hoje']),
  modalOpen: false,
  modalTipo: 'conta-a-pagar',
  editId: null,
  exportOpen: false,
  pagarModalOpen: false,
  planosModalOpen: false,
  error: null,
};

const $ = sel => document.querySelector(sel);
const genId = () => Date.now()+'-'+Math.random().toString(36).slice(2,7);
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtMoney = n => 'R$ ' + Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = iso => { if(!iso) return '-'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; };
const planoInfo = id => state.planos.find(p=>p.id===id) || {id:id||'sem-plano', label:'Sem plano', color:'#746C5C'};

function getSituacao(c){
  if(c.pagamento) return 'paga';
  const hoje = todayStr();
  if(c.vencimento < hoje) return 'vencida';
  if(c.vencimento === hoje) return 'vence-hoje';
  return 'em-aberto';
}
const SITUACAO_LABEL = {'em-aberto':'Em aberto','vencida':'Vencida','paga':'Paga','vence-hoje':'Vence hoje'};

async function loadData(){
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?token=' + encodeURIComponent(ACCESS_TOKEN), { method:'GET' });
    const data = await res.json();
    if(data && data.ok){
      state.contas = data.contas || [];
      state.planos = data.planos || [];
      state.error = null;
    } else {
      state.contas = [];
      state.error = 'Não foi possível carregar (acesso não autorizado). Verifique se o token está correto.';
    }
  }catch(e){
    state.contas = [];
    state.error = 'Não foi possível carregar os dados da planilha agora. Verifique a conexão e recarregue a página.';
  }
  state.loading = false;
  render();
}

// Envia só o que mudou (itens novos/editados e ids excluídos) pro Apps Script.
// O script grava com trava (LockService), então duas pessoas salvando ao mesmo
// tempo não se atropelam mais — e a resposta sempre traz a lista completa e
// atualizada direto da planilha, então o app nunca fica com uma versão velha.
async function syncChange(changedContas, deletedIds, retriesLeft){
  if(retriesLeft===undefined) retriesLeft = 2;
  lastSyncPayload = { contas: changedContas, deletedIds: deletedIds };
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'sync', token: ACCESS_TOKEN, contas: changedContas, deletedIds: deletedIds }),
    });
    const data = await res.json();
    if(data && data.ok){
      state.contas = data.contas || [];
      if(data.planos) state.planos = data.planos;
      state.error = null;
      render();
      return;
    }
    throw new Error((data && data.error) || 'Falha ao salvar');
  }catch(e){
    if(retriesLeft>0){
      await new Promise(r=>setTimeout(r, 700));
      return syncChange(changedContas, deletedIds, retriesLeft-1);
    }
    state.error = 'Não foi possível salvar agora (conexão instável). Suas alterações continuam nesta tela — clique em "Tentar novamente".';
    render();
  }
}

// Mesmo esquema, mas pra planos de contas (criar/renomear/excluir).
async function syncPlanos(changedPlanos, deletedPlanoIds, retriesLeft){
  if(retriesLeft===undefined) retriesLeft = 2;
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'sync', token: ACCESS_TOKEN, planos: changedPlanos, deletedPlanoIds: deletedPlanoIds }),
    });
    const data = await res.json();
    if(data && data.ok){
      state.planos = data.planos || [];
      if(data.contas) state.contas = data.contas;
      state.error = null;
      render();
      return;
    }
    throw new Error((data && data.error) || 'Falha ao salvar');
  }catch(e){
    if(retriesLeft>0){
      await new Promise(r=>setTimeout(r, 700));
      return syncPlanos(changedPlanos, deletedPlanoIds, retriesLeft-1);
    }
    state.error = 'Não foi possível salvar os planos de contas agora (conexão instável). Tente novamente.';
    render();
  }
}

function getFiltered(){
  return state.contas.filter(c=>{
    if(state.filterPlano!=='todos' && c.plano!==state.filterPlano) return false;
    if(state.filterBusca && !c.fornecedor.toLowerCase().includes(state.filterBusca.toLowerCase())) return false;
    const dateVal = c[state.filterDateField];
    if(state.filterMes){
      if(!dateVal || dateVal.slice(0,7)!==state.filterMes) return false;
    }
    if(state.filterDe){
      if(!dateVal || dateVal < state.filterDe) return false;
    }
    if(state.filterAte){
      if(!dateVal || dateVal > state.filterAte) return false;
    }
    const sit = getSituacao(c);
    if(!state.filterSituacao.has(sit)) return false;
    return true;
  }).sort((a,b)=>{
    const order = {'vencida':0, 'vence-hoje':1, 'em-aberto':2, 'paga':3};
    const diff = order[getSituacao(a)] - order[getSituacao(b)];
    if(diff!==0) return diff;
    return a.vencimento.localeCompare(b.vencimento);
  });
}
function getSelectedRows(){
  return state.contas.filter(c=>state.selected.has(c.id));
}

function render(){
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  const app = $('#app');
  const all = state.contas;
  const contasDoPlano = state.filterPlano==='todos' ? all : all.filter(c=>c.plano===state.filterPlano);
  const naoPagas = contasDoPlano.filter(c=>getSituacao(c)!=='paga');
  const aVencer = naoPagas.filter(c=>getSituacao(c)==='em-aberto').reduce((s,c)=>s+c.valor,0);
  const vencidas = naoPagas.filter(c=>getSituacao(c)==='vencida').reduce((s,c)=>s+c.valor,0);
  const venceHoje = naoPagas.filter(c=>getSituacao(c)==='vence-hoje').reduce((s,c)=>s+c.valor,0);
  const totalSelecionadas = getSelectedRows().reduce((s,c)=>s+c.valor,0);

  const filtered = getFiltered();
  const hasSelection = state.selected.size>0;

  app.innerHTML = `
    <div class="topbar">
      <div>
        <h1>Controle de Despesas</h1>
        <div class="sub"><span class="sync-dot" style="background:${state.error?'var(--red)':'var(--green)'};"></span>Sincronizado com Google Sheets · ${state.planos.length} plano${state.planos.length===1?'':'s'} de contas</div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="btn-planos">Planos de contas</button>
        <button class="btn btn-ghost" id="btn-import">Importar CSV</button>
        <input type="file" id="import-file" accept=".csv" style="display:none">
        <div class="dropdown-wrap">
          <button class="btn btn-ghost" id="btn-export">Exportar ▾</button>
          ${state.exportOpen ? `
          <div class="export-menu" id="export-menu">
            <div class="group-label">DESPESAS GERAIS (com os filtros atuais)</div>
            <button data-exp="pdf-geral">Exportar PDF</button>
            <button data-exp="xls-geral">Exportar XLS</button>
            <button data-exp="csv-geral">Exportar CSV</button>
            <div class="divider"></div>
            <div class="group-label">DESPESAS SELECIONADAS</div>
            <button data-exp="pdf-sel" ${hasSelection?'':'disabled'}>Exportar PDF</button>
            <button data-exp="xls-sel" ${hasSelection?'':'disabled'}>Exportar XLS</button>
          </div>` : ''}
        </div>
        <button class="btn btn-primary" id="btn-nova">+ Nova despesa</button>
      </div>
    </div>

    <div class="cards">
      <div class="card"><div class="label">A VENCER${state.filterPlano!=='todos'?' · '+planoInfo(state.filterPlano).label.toUpperCase():''}</div><div class="value">${fmtMoney(aVencer)}</div></div>
      <div class="card vencidas"><div class="label">VENCIDAS${state.filterPlano!=='todos'?' · '+planoInfo(state.filterPlano).label.toUpperCase():''}</div><div class="value">${fmtMoney(vencidas)}</div></div>
      <div class="card hoje"><div class="label">VENCE HOJE${state.filterPlano!=='todos'?' · '+planoInfo(state.filterPlano).label.toUpperCase():''}</div><div class="value">${fmtMoney(venceHoje)}</div></div>
      <div class="card"><div class="label">TOTAL SELECIONADAS</div><div class="value">${fmtMoney(totalSelecionadas)}</div></div>
    </div>

    <div class="filterbar">
      <select id="f-plano">
        <option value="todos">Todos os planos de contas</option>
        ${state.planos.map(p=>`<option value="${p.id}" ${state.filterPlano===p.id?'selected':''}>${p.label}</option>`).join('')}
      </select>
      <input class="grow" type="text" id="f-busca" placeholder="Pesquisar fornecedor…" value="${state.filterBusca}">
      <select id="f-datefield">
        <option value="vencimento" ${state.filterDateField==='vencimento'?'selected':''}>Por vencimento</option>
        <option value="pagamento" ${state.filterDateField==='pagamento'?'selected':''}>Por pagamento</option>
      </select>
      <input type="month" id="f-mes" value="${state.filterMes}">
      <input type="date" id="f-de" value="${state.filterDe}">
      <input type="date" id="f-ate" value="${state.filterAte}">
      <button class="clear" id="f-clear">✕ Limpar</button>
    </div>
    ${(state.filterMes || state.filterDe || state.filterAte) ? `
    <div style="margin:8px 24px 0;font-size:12px;color:var(--ink-soft);">
      Filtrando por <b style="color:var(--ink);">${state.filterDateField==='pagamento'?'data de pagamento':'data de vencimento'}</b>
      ${state.filterMes ? ` · mês ${state.filterMes.split('-').reverse().join('/')}` : ''}
      ${state.filterDe ? ` · de ${fmtDate(state.filterDe)}` : ''}
      ${state.filterAte ? ` · até ${fmtDate(state.filterAte)}` : ''}
    </div>` : ''}

    <div class="statusbar">
      <div class="status-chips">
        <label><input type="checkbox" data-sit="vence-hoje" ${state.filterSituacao.has('vence-hoje')?'checked':''}> Vence hoje</label>
        <label><input type="checkbox" data-sit="vencida" ${state.filterSituacao.has('vencida')?'checked':''}> Vencidas</label>
        <label><input type="checkbox" data-sit="em-aberto" ${state.filterSituacao.has('em-aberto')?'checked':''}> Em aberto</label>
        <label><input type="checkbox" data-sit="paga" ${state.filterSituacao.has('paga')?'checked':''}> Pagas</label>
        <span class="desmarcar" id="desmarcar-tudo">Desmarcar tudo</span>
      </div>
      <div class="right-actions">
        <button class="btn btn-green" id="btn-pagar" ${hasSelection?'':'disabled style="opacity:.5;cursor:not-allowed;"'}>✓ Pagar selecionadas</button>
      </div>
    </div>

    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th style="width:34px;"><input type="checkbox" id="check-all" ${filtered.length>0 && filtered.every(c=>state.selected.has(c.id)) ? 'checked' : ''}></th>
            <th>Fornecedor</th>
            <th>Valor</th>
            <th>Vencimento</th>
            <th>Pagamento</th>
            <th>Situação</th>
            <th style="width:80px;">Ações</th>
          </tr>
        </thead>
        <tbody>
          ${state.loading ? `<tr class="empty-row"><td colspan="7">Carregando…</td></tr>` :
            filtered.length===0 ? `<tr class="empty-row"><td colspan="7"><b>Nenhuma despesa encontrada</b>Ajuste os filtros ou lance uma nova despesa acima.</td></tr>` :
            filtered.map(c=>{
              const sit = getSituacao(c);
              const plano = planoInfo(c.plano);
              return `
              <tr>
                <td><input type="checkbox" class="row-check" data-id="${c.id}" ${state.selected.has(c.id)?'checked':''}></td>
                <td class="fornecedor">${escapeHtml(c.fornecedor)}${c.anexo ? ` <a href="${c.anexo}" target="_blank" rel="noopener" title="Ver anexo" style="text-decoration:none;">📎</a>` : ''}<br><span class="plano-tag" style="background:${plano.color}">${plano.label}</span></td>
                <td class="valor-cell">${fmtMoney(c.valor)}</td>
                <td class="date-cell">${fmtDate(c.vencimento)}</td>
                <td class="date-cell">${fmtDate(c.pagamento)}</td>
                <td><span class="badge ${sit}">${SITUACAO_LABEL[sit].toUpperCase()}</span></td>
                <td class="acoes">
                  <button class="icon-btn" data-edit="${c.id}" title="Editar">✎</button>
                  <button class="icon-btn danger" data-del="${c.id}" title="Excluir">🗑</button>
                </td>
              </tr>`;
            }).join('')
          }
        </tbody>
      </table>
    </div>

    <div class="footer-note">
      <span>${all.length} despesa${all.length===1?'':'s'} no total · ${filtered.length} exibida${filtered.length===1?'':'s'} com os filtros atuais</span>
      ${all.length>0 ? `<span class="clear" id="clear-all" style="cursor:pointer;text-decoration:underline;">Limpar tudo</span>` : ''}
    </div>
    ${state.error ? `<div style="margin:10px 24px 0;color:var(--red);font-size:12.5px;">${state.error} <span id="retry-save" style="cursor:pointer;text-decoration:underline;font-weight:600;">Tentar novamente</span></div>` : ''}

    ${state.modalOpen ? renderModal() : ''}
    ${state.pagarModalOpen ? renderPagarModal() : ''}
    ${state.planosModalOpen ? renderPlanosModal() : ''}
  `;

  bindEvents();

  if(activeId){
    const toFocus = document.getElementById(activeId);
    if(toFocus){
      toFocus.focus();
      if(selStart!=null && typeof toFocus.setSelectionRange === 'function'){
        try{ toFocus.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function renderPagarModal(){
  const rows = getSelectedRows();
  const total = rows.reduce((s,c)=>s+c.valor,0);
  return `
    <div class="modal-overlay" id="pagar-overlay">
      <div class="modal">
        <h2>Confirmar pagamento</h2>
        <p style="font-size:13px;color:var(--ink-soft);margin:-6px 0 14px;">
          ${rows.length} despesa${rows.length===1?'':'s'} selecionada${rows.length===1?'':'s'} · total ${fmtMoney(total)}
        </p>
        <form id="pagar-form">
          <div class="field"><label>Data de pagamento</label><input type="date" name="dataPagamento" value="${todayStr()}" required></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" id="pagar-cancel">Cancelar</button>
            <button type="submit" class="btn btn-green">Confirmar pagamento</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function renderPlanosModal(){
  return `
    <div class="modal-overlay" id="planos-overlay">
      <div class="modal">
        <h2>Planos de contas</h2>
        <p style="font-size:12.5px;color:var(--ink-soft);margin:-8px 0 14px;">Renomeie, mude a cor ou exclua. As despesas já lançadas acompanham o novo nome automaticamente.</p>
        <div class="planos-list">
          ${state.planos.map(p=>{
            const emUso = state.contas.some(c=>c.plano===p.id);
            return `
            <div class="plano-row">
              <input type="color" class="plano-color-input" data-plano-id="${p.id}" value="${p.color}">

          <button type="button" class="btn btn-outline" id="planos-close">Fechar</button>

function renderModal(){
  const editing = state.editId ? state.contas.find(c=>c.id===state.editId) : null;
  const tipo = editing ? editing.tipo : state.modalTipo;
  return `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <h2>${editing? 'Editar despesa' : 'Nova despesa'}</h2>
        ${!editing ? `
        <div class="tipo-toggle">
          <button type="button" data-tipo="conta-a-pagar" class="${tipo==='conta-a-pagar'?'active':''}">Conta a pagar</button>
          <button type="button" data-tipo="avulso" class="${tipo==='avulso'?'active':''}">Lançamento avulso</button>
        </div>` : ''}
        <form id="conta-form">
          <div class="field"><label>Fornecedor / descrição</label><input type="text" name="fornecedor" value="${editing? escapeAttr(editing.fornecedor):''}" required></div>
          <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" min="0.01" name="valor" value="${editing? editing.valor:''}" required></div>
          <div class="field"><label>Plano de contas</label>
            <select name="plano">${state.planos.map(p=>`<option value="${p.id}" ${editing&&editing.plano===p.id?'selected':''}>${p.label}</option>`).join('')}</select>
          </div>
          ${tipo==='conta-a-pagar' ? `
          <div class="field"><label>Vencimento</label><input type="date" name="vencimento" value="${editing? editing.vencimento:''}" required></div>
          ` : `
          <div class="field"><label>Data</label><input type="date" name="vencimento" value="${editing? editing.vencimento: todayStr()}" required></div>
          `}
          <div class="field">
            <label>Anexo (nota fiscal, boleto...)</label>
            ${editing && editing.anexo ? `<div style="margin-bottom:6px;font-size:12.5px;"><a href="${editing.anexo}" target="_blank" rel="noopener">📎 Ver anexo atual</a> — escolha outro arquivo abaixo pra substituir</div>` : ''}
            <input type="file" name="anexo" accept=".pdf,image/*">
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" id="modal-cancel">Cancelar</button>
            <button type="submit" class="btn btn-primary">${editing?'Salvar':'Lançar'}</button>

function bindEvents(){
  const app = $('#app');

  app.querySelector('#btn-planos').addEventListener('click', ()=>{
    state.planosModalOpen = true; state.exportOpen=false; render();
  });

  app.querySelector('#btn-nova').addEventListener('click', ()=>{
    state.modalOpen = true; state.modalTipo='conta-a-pagar'; state.editId=null; state.exportOpen=false; render();
  });

  app.querySelectorAll('.icon-btn[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.editId = btn.dataset.edit; state.modalOpen = true; render(); });
  });
  app.querySelectorAll('.icon-btn[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('Excluir esta despesa?')){
        const id = btn.dataset.del;
        state.contas = state.contas.filter(c=>c.id!==id);
        state.selected.delete(id);
        render();
        syncChange([], [id]);
      }
    });
  });

  app.querySelector('#f-plano').addEventListener('change', e=>{ state.filterPlano=e.target.value; render(); });
  app.querySelector('#f-busca').addEventListener('input', e=>{ state.filterBusca=e.target.value; render(); });
  app.querySelector('#f-datefield').addEventListener('change', e=>{ state.filterDateField=e.target.value; render(); });
  app.querySelector('#f-mes').addEventListener('change', e=>{ state.filterMes=e.target.value; render(); });
  app.querySelector('#f-de').addEventListener('change', e=>{ state.filterDe=e.target.value; render(); });
  app.querySelector('#f-ate').addEventListener('change', e=>{ state.filterAte=e.target.value; render(); });
  app.querySelector('#f-clear').addEventListener('click', ()=>{
    state.filterPlano='todos'; state.filterBusca=''; state.filterMes=''; state.filterDe=''; state.filterAte=''; state.filterDateField='vencimento';
    render();
  });

  app.querySelectorAll('.status-chips input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) state.filterSituacao.add(cb.dataset.sit);
      else state.filterSituacao.delete(cb.dataset.sit);
      render();
    });
  });
  app.querySelector('#desmarcar-tudo').addEventListener('click', ()=>{
    state.filterSituacao = new Set();
    render();
  });

  app.querySelector('#check-all').addEventListener('change', e=>{
    const filtered = getFiltered();
    if(e.target.checked) filtered.forEach(c=>state.selected.add(c.id));
    else filtered.forEach(c=>state.selected.delete(c.id));
    render();
  });
  app.querySelectorAll('.row-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) state.selected.add(cb.dataset.id);
      else state.selected.delete(cb.dataset.id);
      render();
    });
  });

  const pagarBtn = app.querySelector('#btn-pagar');
  if(pagarBtn && state.selected.size>0){
    pagarBtn.addEventListener('click', ()=>{
      state.pagarModalOpen = true;
      render();
    });
  }

  const pagarOverlay = app.querySelector('#pagar-overlay');
  if(pagarOverlay){
    pagarOverlay.addEventListener('click', e=>{ if(e.target===pagarOverlay){ state.pagarModalOpen=false; render(); } });
    app.querySelector('#pagar-cancel').addEventListener('click', ()=>{ state.pagarModalOpen=false; render(); });
    app.querySelector('#pagar-form').addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const dataPagamento = fd.get('dataPagamento');
      if(!dataPagamento) return;
      const changed = [];
      state.contas = state.contas.map(c=>{
        if(state.selected.has(c.id)){
          const updated = {...c, pagamento: dataPagamento};
          changed.push(updated);
          return updated;
        }
        return c;
      });
      state.selected.clear();
      state.pagarModalOpen = false;
      render();
      syncChange(changed, []);
    });
  }

  app.querySelector('#btn-import').addEventListener('click', ()=>{
    app.querySelector('#import-file').click();
  });
  app.querySelector('#import-file').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{ importFromCsvText(ev.target.result); };
    reader.readAsText(file, 'UTF-8');
  });

  app.querySelector('#btn-export').addEventListener('click', (e)=>{
    e.stopPropagation();
    state.exportOpen = !state.exportOpen;
    render();
  });
  const menu = app.querySelector('#export-menu');
  if(menu){
    menu.addEventListener('click', e=> e.stopPropagation());
    menu.querySelectorAll('[data-exp]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const action = btn.dataset.exp;
        if(action==='pdf-geral') exportPdf(getFiltered(), 'Despesas gerais');
        if(action==='pdf-sel') exportPdf(getSelectedRows(), 'Despesas selecionadas');
        if(action==='xls-geral') exportXls(getFiltered(), 'despesas-gerais.xlsx');
        if(action==='xls-sel') exportXls(getSelectedRows(), 'despesas-selecionadas.xlsx');
        if(action==='csv-geral') exportCsv(getFiltered(), 'despesas-gerais.csv');
        state.exportOpen = false;
        render();
      });
    });
    document.addEventListener('click', function closeMenu(){
      state.exportOpen = false; render();
      document.removeEventListener('click', closeMenu);
    }, {once:true});
  }

  const retryBtn = app.querySelector('#retry-save');
  if(retryBtn){
    retryBtn.addEventListener('click', ()=>{
      if(lastSyncPayload) syncChange(lastSyncPayload.contas, lastSyncPayload.deletedIds);
      else loadData();
    });
  }

  const clearAll = app.querySelector('#clear-all');
  if(clearAll){
    clearAll.addEventListener('click', ()=>{
      if(confirm('Excluir todas as despesas? Essa ação não pode ser desfeita.')){
        const ids = state.contas.map(c=>c.id);
        state.contas = []; state.selected.clear();
        render();
        syncChange([], ids);
      }
    });
  }

  const planosOverlay = app.querySelector('#planos-overlay');
  if(planosOverlay){
    planosOverlay.addEventListener('click', e=>{ if(e.target===planosOverlay){ state.planosModalOpen=false; render(); } });
    app.querySelector('#planos-close').addEventListener('click', ()=>{ state.planosModalOpen=false; render(); });

    app.querySelectorAll('.plano-label-input').forEach(input=>{
      input.addEventListener('change', ()=>{
        const id = input.dataset.planoId;
        const novoLabel = input.value.trim();
        if(!novoLabel) return;
        const plano = state.planos.find(p=>p.id===id);
        if(!plano || plano.label===novoLabel) return;
        plano.label = novoLabel;
        syncPlanos([plano], []);
      });
    });

    app.querySelectorAll('.plano-color-input').forEach(input=>{
      input.addEventListener('change', ()=>{
        const id = input.dataset.planoId;
        const plano = state.planos.find(p=>p.id===id);
        if(!plano) return;
        plano.color = input.value;
        render();
        syncPlanos([plano], []);
      });
    });

    app.querySelectorAll('[data-plano-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.planoDel;
        const emUso = state.contas.filter(c=>c.plano===id).length;
        if(emUso>0){
          alert(`Esse plano tem ${emUso} despesa(s) vinculada(s). Mude o plano dessas despesas (ou exclua-as) antes de remover este plano de contas.`);
          return;
        }
        if(!confirm('Excluir este plano de contas?')) return;
        state.planos = state.planos.filter(p=>p.id!==id);
        if(state.filterPlano===id) state.filterPlano='todos';
        render();
        syncPlanos([], [id]);
      });
    });

    app.querySelector('#btn-add-plano').addEventListener('click', ()=>{
      const labelInput = app.querySelector('#novo-plano-label');
      const colorInput = app.querySelector('#novo-plano-color');
      const label = labelInput.value.trim();
      if(!label) { labelInput.focus(); return; }
      const novo = { id: genId(), label, color: colorInput.value };
      state.planos.push(novo);
      render();
      syncPlanos([novo], []);
    });
  }

  const overlay = app.querySelector('#modal-overlay');
  if(overlay){
    overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
    app.querySelector('#modal-cancel').addEventListener('click', closeModal);
    app.querySelectorAll('.tipo-toggle button').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.modalTipo = btn.dataset.tipo; render(); });
    });
    app.querySelector('#conta-form').addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const valor = parseFloat(fd.get('valor'));
      if(!valor || valor<=0) return;

      const anexoFile = fd.get('anexo');
      let anexoBase64 = null;
      if(anexoFile && anexoFile.size>0){
        if(anexoFile.size > 8*1024*1024){
          alert('O arquivo é muito grande (máximo 8MB). Escolha um arquivo menor.');
          return;
        }
        anexoBase64 = await fileToBase64(anexoFile);
      }

      let changedItem;
      if(state.editId){
        state.contas = state.contas.map(c=> {
          if(c.id===state.editId){
            changedItem = {
              ...c,
              fornecedor: fd.get('fornecedor').trim(),
              valor, plano: fd.get('plano'),
              vencimento: fd.get('vencimento'),
            };
            if(anexoBase64){
              changedItem.anexoBase64 = anexoBase64;
              changedItem.anexoNome = anexoFile.name;
              changedItem.anexoMimeType = anexoFile.type;
            }
            return changedItem;
          }
          return c;
        });
      } else {
        const isAvulso = state.modalTipo==='avulso';
        changedItem = {
          id: genId(),
          fornecedor: fd.get('fornecedor').trim(),
          valor, plano: fd.get('plano'),
          tipo: state.modalTipo,
          vencimento: fd.get('vencimento'),
          pagamento: isAvulso ? fd.get('vencimento') : null,
        };
        if(anexoBase64){
          changedItem.anexoBase64 = anexoBase64;
          changedItem.anexoNome = anexoFile.name;
          changedItem.anexoMimeType = anexoFile.type;
        }
        state.contas.unshift(changedItem);
      }
      closeModal();
      syncChange([changedItem], []);
    });
  }
}

function closeModal(){ state.modalOpen=false; state.editId=null; render(); }

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function exportCsv(rows, filename){
  const header = ['Fornecedor','Valor','Plano de contas','Vencimento','Pagamento','Situacao','Anexo'];
  const lines = [header.join(';')];
  rows.forEach(c=>{
    lines.push([
      c.fornecedor.replace(/;/g,','), c.valor.toFixed(2).replace('.',','),
      planoInfo(c.plano).label, fmtDate(c.vencimento), fmtDate(c.pagamento),
      SITUACAO_LABEL[getSituacao(c)], c.anexo || ''
    ].join(';'));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename || 'despesas.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function exportXls(rows, filename){
  const data = rows.map(c=>({
    'Fornecedor': c.fornecedor,
    'Plano de contas': planoInfo(c.plano).label,
    'Valor': c.valor,
    'Vencimento': fmtDate(c.vencimento),
    'Pagamento': fmtDate(c.pagamento),
    'Situação': SITUACAO_LABEL[getSituacao(c)],
    'Anexo': c.anexo || ''
  }));
  const total = rows.reduce((s,c)=>s+c.valor,0);
  data.push({'Fornecedor':'', 'Plano de contas':'', 'Valor': total, 'Vencimento':'', 'Pagamento':'', 'Situação':'TOTAL', 'Anexo':''});
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Despesas');
  XLSX.writeFile(wb, filename || 'despesas.xlsx');
}

function exportPdf(rows, title){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const planosPresentes = [...new Set(rows.map(c=>c.plano))].map(id=>planoInfo(id).label);
  const planoSubtitle = planosPresentes.length===1 ? planosPresentes[0]
    : (planosPresentes.length>1 ? planosPresentes.join(' + ') : 'Nenhum plano de contas');

  doc.setFontSize(14);
  doc.text(title, 14, 16);
  doc.setFontSize(10.5);
  doc.setTextColor(90,100,112);
  doc.text(planoSubtitle, 14, 22.5);
  doc.setTextColor(0,0,0);
  doc.setFontSize(9);
  doc.text('Gerado em ' + fmtDate(todayStr()), 14, 28.5);
  const body = rows.map(c=>[
    c.fornecedor, planoInfo(c.plano).label, fmtMoney(c.valor),
    fmtDate(c.vencimento), fmtDate(c.pagamento), SITUACAO_LABEL[getSituacao(c)]
  ]);
  doc.autoTable({
    startY: 34,
    head: [['Fornecedor','Plano de contas','Valor','Vencimento','Pagamento','Situação']],
    body,
    styles:{ fontSize:8.5 },
    headStyles:{ fillColor:[15,27,44] },
  });
  const total = rows.reduce((s,c)=>s+c.valor,0);
  const finalY = doc.lastAutoTable.finalY || 28;
  doc.setFontSize(11);
  doc.text('Total: ' + fmtMoney(total), 14, finalY + 10);
  doc.save((title==='Despesas selecionadas' ? 'despesas-selecionadas.pdf' : 'despesas-gerais.pdf'));
}

function normalizeStr(str){
  return String(str||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
}
function parseValorBR(str){
  if(!str) return null;
  const n = String(str).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',', '.');
  const v = parseFloat(n);
  return isNaN(v) ? null : v;
}
function parseDateBR(str){
  if(!str || !String(str).trim()) return null;
  const parts = String(str).trim().split('/');
  if(parts.length!==3) return null;
  const [d,m,y] = parts;
  return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
function planoFromControle(str){
  const n = normalizeStr(str);
  if(!n) return state.planos[0] ? state.planos[0].id : '';
  const exato = state.planos.find(p=> normalizeStr(p.label)===n);
  if(exato) return exato.id;
  const parcial = state.planos.find(p=> n.includes(normalizeStr(p.label)) || normalizeStr(p.label).includes(n));
  if(parcial) return parcial.id;
  // fallback: mantém compatibilidade com nomes antigos usados antes de existir gerenciamento de planos
  if(n.includes('alvorada')) return 'alvorada';
  if(n.includes('boa esperanca') || n.includes('santa helena')) return 'boa-esperanca';
  if(n.includes('romerio')) return 'romerio';
  return state.planos[0] ? state.planos[0].id : '';
}
function parseCsvText(text){
  const clean = text.replace(/^\uFEFF/, '');
  const lines = clean.split(/\r\n|\n/).filter(l=>l.trim().length>0);
  if(lines.length<2) return [];
  const header = lines[0].split(';').map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cells = line.split(';');
    const row = {};
    header.forEach((h,i)=>{ row[h] = (cells[i]||'').trim(); });
    return row;
  });
}
function importFromCsvText(text){
  let rows = parseCsvText(text);

  // remove duplicatas dentro do próprio arquivo (mesmo fornecedor + vencimento)
  const seen = new Map();
  rows.forEach(r=>{
    const key = normalizeStr(r['Fornecedor']) + '|' + parseDateBR(r['Vencimento']);
    seen.set(key, r); // mantém a última ocorrência
  });
  rows = Array.from(seen.values());

  let added=0, updated=0, skipped=0;
  const changed = [];
  rows.forEach(r=>{
    const fornecedor = (r['Fornecedor']||'').trim();
    const vencimento = parseDateBR(r['Vencimento']);
    const valor = parseValorBR(r['Valor']);
    const pagamento = parseDateBR(r['Pagamento']);
    const planoTexto = r['Controle'] || r['Plano de contas'] || '';
    const plano = planoFromControle(planoTexto);
    if(!fornecedor || !vencimento || valor==null){ skipped++; return; }
    const match = state.contas.find(c=>
      normalizeStr(c.fornecedor)===normalizeStr(fornecedor) && c.vencimento===vencimento
    );
    if(match){
      if((pagamento && match.pagamento!==pagamento) || match.valor!==valor){
        match.pagamento = pagamento || match.pagamento;
        match.valor = valor;
        changed.push(match);
        updated++;
      } else {
        skipped++;
      }
    } else {
      const novo = {
        id: genId(), fornecedor, valor, plano, tipo:'conta-a-pagar',
        vencimento, pagamento: pagamento || null,
      };
      state.contas.unshift(novo);
      changed.push(novo);
      added++;
    }
  });
  render();
  if(changed.length>0){
    syncChange(changed, []);
  }
  alert(`Importação concluída:\n${added} despesa(s) adicionada(s)\n${updated} atualizada(s)\n${skipped} já existiam sem mudanças`);
}

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function escapeAttr(str){ return String(str).replace(/"/g,'&quot;'); }

render();
loadData();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
